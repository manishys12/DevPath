# Render deployment configuration
services:
  # Web service
  - type: web
    name: edgeroute
    env: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn wsgi:app
    plan: free
    healthCheckPath: /
    envVars:
      - key: FLASK_APP
        value: wsgi.py
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edgeroute-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

# Database
databases:
  - name: edgeroute-db
    plan: free
    databaseName: edgeroute
    user: edgeroute_user
